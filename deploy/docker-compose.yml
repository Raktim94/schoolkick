# Run: cp deploy/.env.example deploy/.env  (edit it)  then  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: schoolkick
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    labels:
      org.opencontainers.image.revision: ${SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://schoolkick:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/schoolkick
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
      # Online payment is off unless a webhook secret is set. PAYMENTS_SANDBOX=1 enables a fake test provider (no real money).
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      PAYMENTS_SANDBOX: ${PAYMENTS_SANDBOX:-0}
    ports: ["${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    x-casaos:
      ports: [{ container: "8080", description: { en_us: "Web port" } }]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolkick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: schoolkick
    volumes: ["schoolkick-db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U schoolkick"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  schoolkick-db: {}
x-casaos:
  architectures: [amd64, arm64]
  main: app
  author: Raktim94
  category: Productivity
  title: { en_us: SchoolKick }
  tagline: { en_us: School attendance with a kept correction history }
  description: { en_us: "Open-source attendance and family view for schools, colleges and coaching centres. Early release." }
  icon: https://raw.githubusercontent.com/Raktim94/schoolkick/main/site/icon.png
  index: /
  port_map: "8080"
