# Run: cp deploy/.env.example deploy/.env  (edit it)  then  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
name: campusos
services:
  app:
    build: { context: .., dockerfile: Dockerfile }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://campusos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/campusos
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
    ports: ["${HTTP_PORT:-8080}:8080"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    x-casaos:
      ports: [{ container: "8080", description: { en_us: "Web port" } }]
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: campusos
    volumes: ["campusos-db:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U campusos"], interval: 5s, timeout: 3s, retries: 10 }
volumes:
  campusos-db: {}
x-casaos:
  architectures: [amd64, arm64]
  main: app
  author: Raktim94
  category: Productivity
  title: { en_us: CampusOS }
  tagline: { en_us: School attendance with a kept correction history }
  description: { en_us: "Open-source attendance and family view for schools, colleges and coaching centres. Early release." }
  icon: https://raw.githubusercontent.com/Raktim94/campusos/main/site/icon.svg
  index: /
  port_map: "8080"
