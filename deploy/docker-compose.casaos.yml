# For CasaOS "Install a customized app" > Import. Pulls the published image, so nothing is built on the box.
# The database is not published on any port; change the password below before you put real data in.
name: schoolkick
services:
  app:
    image: ghcr.io/raktim94/schoolkick:0.3.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PORT: "3847"
      DATABASE_URL: postgres://schoolkick:change-this-password@db:5432/schoolkick
      SITE_URL: http://localhost:3847
      ALLOW_SIGNUP: "1"
    ports: ["3847:3847"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck: { test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3847/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""], interval: 10s, timeout: 4s, retries: 12, start_period: 20s }
    x-casaos:
      ports: [{ container: "3847", description: { en_us: "Web port" } }]
      envs:
        - { container: ALLOW_SIGNUP, description: { en_us: "1 lets anyone create an institution; set 0 after you have created yours" } }
        - { container: SITE_URL, description: { en_us: "Public address of this app, for example https://school.example.com" } }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolkick
      POSTGRES_PASSWORD: change-this-password
      POSTGRES_DB: schoolkick
    volumes: ["/DATA/AppData/schoolkick/pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U schoolkick -d schoolkick"], interval: 5s, timeout: 3s, retries: 12 }
x-casaos:
  architectures: [amd64, arm64]
  main: app
  author: Raktim Ranjit
  category: Productivity
  title: { en_us: SchoolKick }
  tagline: { en_us: School attendance with a kept correction history }
  description: { en_us: "Open-source attendance and family view for schools, colleges and coaching centres. Early release, not security audited." }
  icon: https://raw.githubusercontent.com/Raktim94/schoolkick/main/site/icon.png
  index: /app/
  port_map: "3847"
  screenshot_link:
    - https://raw.githubusercontent.com/Raktim94/schoolkick/main/docs/screenshots/dashboard-desktop.png
    - https://raw.githubusercontent.com/Raktim94/schoolkick/main/docs/screenshots/teacher-roster-mobile.png
    - https://raw.githubusercontent.com/Raktim94/schoolkick/main/docs/screenshots/fees-staff-desktop.png
  thumbnail: https://raw.githubusercontent.com/Raktim94/schoolkick/main/docs/screenshots/dashboard-desktop.png
  tips:
    before_install:
      en_us: "Replace change-this-password (in both the app and database sections) with a long random value, and set SITE_URL to this box's address, before the first start. After creating your institution, set ALLOW_SIGNUP to 0."
