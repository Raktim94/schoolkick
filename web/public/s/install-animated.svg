<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">SchoolKick one-command install</title><desc id="d">Animated terminal: one curl command installs SchoolKick and prints the address to open.</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}.cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}@keyframes ty{0%,3%{width:0}24%,95%{width:900px}100%{width:0}}.ty{animation:ty 16s steps(70) infinite}@keyframes l1{0%,30%{opacity:0;transform:translateX(-8px)}33%,95%{opacity:1;transform:none}100%{opacity:0}}.l1{animation:l1 16s ease-out infinite;opacity:0}@keyframes l2{0%,44%{opacity:0;transform:translateX(-8px)}47%,95%{opacity:1;transform:none}100%{opacity:0}}.l2{animation:l2 16s ease-out infinite;opacity:0}@keyframes l3{0%,58%{opacity:0;transform:translateX(-8px)}61%,95%{opacity:1;transform:none}100%{opacity:0}}.l3{animation:l3 16s ease-out infinite;opacity:0}@keyframes l4{0%,74%{opacity:0;transform:translateX(-8px)}77%,95%{opacity:1;transform:none}100%{opacity:0}}.l4{animation:l4 16s ease-out infinite;opacity:0}@keyframes pb{0%,32%{width:0}70%,95%{width:700px}100%{width:0}}.pb{animation:pb 16s ease-in-out infinite}@keyframes ok{0%,76%{opacity:0;transform:scale(.8)}80%,95%{opacity:1;transform:scale(1)}100%{opacity:0}}.ok{animation:ok 16s ease-out infinite;opacity:0;transform-origin:1070px 330px}</style>
<rect width="1200" height="400" rx="18" fill="#0c2e24"/>
<rect x="24" y="24" width="1152" height="352" rx="12" fill="#0a241c" stroke="#245c49"/>
<rect x="24" y="24" width="1152" height="36" rx="12" fill="#143d31"/><rect x="24" y="48" width="1152" height="12" fill="#143d31"/>
<circle cx="48" cy="42" r="6" fill="#d7644d"/><circle cx="68" cy="42" r="6" fill="#e0b341"/><circle cx="88" cy="42" r="6" fill="#4f9d7c"/>
<text x="600" y="47" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9dbdb0">Ubuntu or Debian &#183; amd64 or arm64</text>
<clipPath id="k"><rect class="ty" x="48" y="106" width="0" height="34"/></clipPath><g clip-path="url(#k)"><text x="48" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#faf7ef">$ curl -fsSL https://schoolkick.nodedr.com/install-linux.sh | sudo bash</text></g><text class="l1" x="48" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#6cc4a1">==> Installing Docker prerequisites</text><text class="l2" x="48" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#6cc4a1">==> Downloading schoolkick 0.3.0 (amd64) and checking SHA-256</text><text class="l3" x="48" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#6cc4a1">==> Installing package, starting PostgreSQL and SchoolKick</text><text class="l4" x="48" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" fill="#f2a38f" font-weight="700">==> Done. Open http://localhost:3847</text>
<rect x="48" y="340" width="700" height="8" rx="4" fill="#143d31"/><rect class="pb" x="48" y="340" width="0" height="8" rx="4" fill="url(#ac)"/>
<defs><linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f2a38f"/><stop offset="1" stop-color="#d7644d"/></linearGradient></defs>
<g class="ok"><rect x="880" y="308" width="272" height="44" rx="22" fill="#e3f1ea" stroke="#4f9d7c"/><path d="M904 330 l7 8 l14 -16" stroke="#174b3b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="936" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#174b3b">SchoolKick is running</text></g>
</svg>