SHORTDESC='Open-source school attendance with a kept correction history (runs in Docker)'
LONGDESC=' SchoolKick is free, open-source school attendance software. This package installs
 a systemd service that runs the published, version-pinned SchoolKick container
 and a PostgreSQL 16 container with Docker Compose, keeping all records in a
 Docker volume on this machine. Open http://localhost:3847 after installing.
 .
 Settings are in /etc/schoolkick/schoolkick.env. Early release: not security
 audited. Back up your data before upgrading.'
