# Installed by the schoolkick .deb. Edit /etc/schoolkick/schoolkick.env, not this file.
services:
  app:
    image: ghcr.io/raktim94/schoolkick:@VERSION@
    container_name: schoolkick
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "3847"
      DATABASE_URL: postgres://schoolkick:${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD in /etc/schoolkick/schoolkick.env}@db:5432/schoolkick
      SITE_URL: ${SITE_URL:-http://localhost:3847}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-1}
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3847}:3847'
    read_only: true
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
  db:
    image: postgres:16-alpine
    container_name: schoolkick-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolkick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: schoolkick
    volumes:
      - schoolkick-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schoolkick -d schoolkick']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  schoolkick-pgdata:
