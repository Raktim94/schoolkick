name: Publish container image

# Builds the SchoolKick image for amd64 and arm64 and pushes it to ghcr.io/raktim94/schoolkick.
# Run by hand with a version (for example 0.1.0) or push a tag such as v0.1.0.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, for example 0.1.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Work out the version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"; [ -n "$v" ] || v="${GITHUB_REF_NAME}"; echo "version=${v#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/raktim94/schoolkick:${{ steps.v.outputs.version }}
            ghcr.io/raktim94/schoolkick:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Raktim94/schoolkick
            org.opencontainers.image.description=SchoolKick: open-source school attendance
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
