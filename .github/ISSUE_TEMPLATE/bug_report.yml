name: Bug report
description: Report a reproducible problem in SchoolKick.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include names, emails, screenshots or other real learner information."
  - type: textarea
    id: expected
    attributes: { label: What did you expect?, description: Describe the intended result. }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: What happened instead?, description: Include steps to reproduce with fictional data. }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: SchoolKick version, placeholder: "0.1.0" }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Browser and operating system }
    validations: { required: false }
