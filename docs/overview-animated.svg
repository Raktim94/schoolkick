<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">SchoolKick animated overview</title>
  <desc id="d">Illustrative sample screen with fictional names: a teacher marks a class register, then corrects one mark. The original entry stays in a history list with the reason, who changed it and when.</desc>
  <style>
    text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
    .serif{font-family:Georgia,'Times New Roman',serif}
    .ink{fill:#1d2924}.mut{fill:#57675e}
    .cycle{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:ease}
    @keyframes r1{0%,6%{opacity:0}10%,100%{opacity:1}}
    @keyframes r2{0%,14%{opacity:0}18%,100%{opacity:1}}
    @keyframes r3{0%,22%{opacity:0}26%,100%{opacity:1}}
    @keyframes saved{0%,32%{opacity:0}36%,100%{opacity:1}}
    @keyframes fix{0%,50%{opacity:0}54%,100%{opacity:1}}
    @keyframes hist{0%,60%{opacity:0;transform:translateY(8px)}66%,100%{opacity:1;transform:none}}
    @keyframes reset{0%,94%{opacity:1}100%{opacity:0}}
    .a1{animation-name:r1}.a2{animation-name:r2}.a3{animation-name:r3}.a4{animation-name:saved}.a5{animation-name:fix}.a6{animation-name:hist}
    @media (prefers-reduced-motion:reduce){.cycle{animation:none!important;opacity:1!important;transform:none!important}}
  </style>
  <rect width="1200" height="420" fill="#faf7ef"/>
  <rect y="408" width="1200" height="12" fill="#174b3b"/>
  <text x="70" y="86" class="serif ink" font-size="54" font-weight="700" letter-spacing="-1.5">A register you can trust.</text>
  <text x="72" y="130" class="mut" font-size="24">Every correction keeps the original, the reason, the person and the time.</text>
  <g transform="translate(70 170)">
    <rect width="520" height="206" rx="10" fill="#fffdf8" stroke="#bdb3a1" stroke-width="2"/>
    <text x="24" y="38" class="mut" font-size="17">Class 5A · Register · today</text>
    <g font-size="21">
      <circle cx="34" cy="76" r="8" fill="#174b3b"/><text x="54" y="83" class="ink">Asha Demo</text>
      <g class="cycle a1"><text x="260" y="83" class="ink">Present</text></g>
      <circle cx="34" cy="116" r="8" fill="#174b3b"/><text x="54" y="123" class="ink">Ravi Demo</text>
      <g class="cycle a2"><text x="260" y="123" class="ink">Present</text></g>
      <circle cx="34" cy="156" r="8" fill="#d7644d"/><text x="54" y="163" class="ink">Meera Demo</text>
      <g class="cycle a3"><text x="260" y="163" class="ink">Absent</text></g>
    </g>
    <g class="cycle a4"><rect x="396" y="14" width="100" height="32" rx="8" fill="#174b3b"/><text x="446" y="36" text-anchor="middle" fill="#fffdf8" font-size="17">Saved</text></g>
    <g class="cycle a5"><text x="338" y="163" fill="#174b3b" font-size="21" font-weight="700">→ Present</text></g>
  </g>
  <g transform="translate(640 170)">
    <rect width="490" height="206" rx="10" fill="#edf2e9" stroke="#bdb3a1" stroke-width="2"/>
    <text x="24" y="38" class="mut" font-size="17">Correction history (cannot be edited)</text>
    <g class="cycle a6" font-size="19">
      <text x="24" y="84" class="ink" font-weight="600">Meera Demo: absent → present</text>
      <text x="24" y="114" class="mut">Reason: “Arrived after the bell”</text>
      <text x="24" y="144" class="mut">Changed by Tara Teacher, 9:42</text>
      <text x="24" y="176" class="ink">Original “absent” entry is kept.</text>
    </g>
  </g>
  <text x="1130" y="395" text-anchor="end" class="mut" font-size="14">Illustrative sample screen. Fictional names and data.</text>
</svg>
